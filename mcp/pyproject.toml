[project]
name = "miss-holi-voyage-mcp"
version = "0.2.0"
description = "Serveur MCP lecture/écriture pour préparer un voyage Miss Holi Voyage."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.4",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# La typographie française est voulue dans les textes rendus à l’IA : l’apostrophe
# courbe et le demi-cadratin des intervalles (« 1–12 ») ne sont pas des confusions.
allowed-confusables = ["’", "–"]
